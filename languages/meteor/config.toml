name = "Meteor"
grammar = "meteor"
path_suffixes = ["mt"]
line_comments = ["//"]

use_autoclose = true

autoclose_before = ")]}"

[[brackets]]
start = "("
end = ")"
close = true
newline = true

[[brackets]]
start = "["
end = "]"
close = true
newline = true

[[brackets]]
start = "{"
end = "}"
close = true
newline = true

[[brackets]]
start = "\""
end = "\""
close = true
newline = false

[[brackets]]
start = "'"
end = "'"
close = true
newline = false
